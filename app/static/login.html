<!doctype html>
<html lang="en" data-default-theme="{{theme}}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{brand}} · Sign in</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="{{brand}}" />
  <script>
    // same resolution as the app: this device's choice, else the instance default
    (() => {
      const valid = ['light', 'dark', 'auto']
      let t = ''
      try { t = localStorage.getItem('refdeck.theme') || '' } catch {}
      if (!valid.includes(t)) t = document.documentElement.dataset.defaultTheme
      if (!valid.includes(t)) t = 'dark'
      if (t === 'auto') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
      document.documentElement.dataset.theme = t
    })()
  </script>
  <style>
    /* self-contained: style.css sits behind the login */
    :root {
      --bg0: #0b0c0f; --bg1: #121419; --bg2: #1a1d24; --bg3: #232833;
      --line: #262a33; --ink: #e8eaf0; --ink2: #8a90a0; --ink3: #565d6e;
      --acc: #e2a14e; --danger: #e0596b;
      --mono: "SF Mono", ui-monospace, SFMono-Regular, Menlo, "JetBrains Mono", monospace;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color-scheme: dark;
    }
    :root[data-theme="light"] {
      --bg0: #f4f4f5; --bg1: #ffffff; --bg2: #ececef; --bg3: #e0e0e5;
      --line: #d8d8de; --ink: #09090b; --ink2: #55565f; --ink3: #8b8d98;
      --acc: #b86e14; --danger: #c93b4e;
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg0); color: var(--ink); font-family: var(--sans); }
    form { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 14px; padding: 28px 24px; background: var(--bg1); border: 1px solid var(--line); border-radius: 12px; }
    h1 { margin: 0 0 6px; font-family: var(--mono); font-size: 13px; font-weight: 500; letter-spacing: .22em; text-transform: uppercase; }
    h1 i { font-style: normal; color: var(--acc); }
    label { display: flex; flex-direction: column; gap: 6px; font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink3); }
    /* 16px inputs: iOS zooms the page on focus below that */
    input { font: 16px var(--sans); background: var(--bg2); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 11px 12px; }
    input:focus { outline: 1px solid var(--acc); outline-offset: 1px; }
    button { margin-top: 6px; font: 600 15px var(--sans); background: var(--acc); color: var(--bg0); border: 0; border-radius: 8px; padding: 12px; cursor: pointer; }
    button:hover { filter: brightness(1.08); }
    .error { margin: 0; color: var(--danger); font-size: 13px; line-height: 1.4; }
    .error:empty { display: none; }
    .fine { margin: 0; color: var(--ink3); font-size: 12px; text-align: center; }
  </style>
</head>
<body>
  <form method="post" action="/login">
    <h1>{{brand}}<i>/</i>deck</h1>
    <p class="error" role="alert">{{error}}</p>
    <label>Username
      <input name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required autofocus />
    </label>
    <label>Password
      <input name="password" type="password" autocomplete="current-password" required />
    </label>
    <button type="submit">Sign in</button>
    <p class="fine">You'll stay signed in on this device for 30 days.</p>
  </form>
</body>
</html>
