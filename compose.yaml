# Generic service definition. Put machine-specific media mounts and
# REFDECK_ROOTS in compose.override.yaml (gitignored) — compose merges it
# automatically. Example override:
#
#   services:
#     refdeck:
#       environment:
#         REFDECK_ROOTS: MyDrive=/media/MyDrive
#       volumes:
#         - /Volumes/MyDrive:/media/MyDrive:ro
services:
  refdeck:
    build: .
    container_name: refdeck
    restart: unless-stopped
    ports:
      - "0.0.0.0:8787:8787"
    cap_add:
      - SYS_ADMIN
      - DAC_READ_SEARCH
    environment:
      REFDECK_DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
